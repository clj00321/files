name: Build install.sh

on:
  push:
    branches: [main]
    paths:
      - 'os/linux/debian13/scripts/bash/**.sh'
      - '!os/linux/debian13/scripts/bash/install.sh'
      - '.github/workflows/build-install.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-install
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DIR: os/linux/debian13/scripts/bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generér install.sh
        run: bash "$DIR/build-install.sh"

      - name: Syntakskontrol
        run: |
          bash -n "$DIR/install.sh"
          bash "$DIR/install.sh" --list

      - name: Commit hvis ændret
        run: |
          if git diff --quiet -- "$DIR/install.sh"; then
            echo "🟢 install.sh er allerede opdateret — intet at committe"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DIR/install.sh"
          git commit -m "chore(debian13): regenerer install.sh [skip ci]"
          git push
